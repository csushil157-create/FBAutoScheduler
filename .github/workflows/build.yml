name: Build FB Auto Scheduler IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unpack app source
        run: |
          set -euo pipefail
          rm -rf src
          mkdir src
          unzip -q FBAutoScheduler_iOS_ReadyToUpload.zip -d src
          test -f src/project.yml

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: src
        run: xcodegen generate

      - name: Build unsigned app
        working-directory: src
        run: |
          set -euo pipefail
          xcodebuild \
            -project FBAutoScheduler.xcodeproj \
            -scheme FBAutoScheduler \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned IPA
        working-directory: src
        run: |
          set -euo pipefail
          APP="build/Build/Products/Release-iphoneos/FBAutoScheduler.app"
          test -d "$APP"
          rm -rf Payload FBAutoScheduler-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          /usr/bin/zip -qry FBAutoScheduler-unsigned.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: FBAutoScheduler-unsigned
          path: src/FBAutoScheduler-unsigned.ipa
          if-no-files-found: error
